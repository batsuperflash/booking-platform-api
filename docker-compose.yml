services:
  postgres:
    image: postgres:16-alpine
    # depends_on:
    #   db:
    #     condition: service_healthy # Ждет именно готовности базы, а не просто старта контейнера
    container_name: booking-platform-postgres
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5433:5432"
    volumes:
      - booking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: booking-platform-api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: booking-platform-swagger-ui
    environment:
      SWAGGER_JSON: /docs/openapi.yaml
    volumes:
      - ./docs:/docs:ro

  nginx:
    image: nginx:alpine
    container_name: booking-platform-nginx
    ports:
      - "8082:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - swagger-ui

volumes:
  booking_postgres_data:
